<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giochi - Giochi & Bans</title>
  
  <meta name="theme-color" content="#2F8FC7">
  
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <main>
    <h1>Giochi</h1>
    
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Cerca giochi..." autocomplete="off">
    </div>
    
    <div id="results" class="card-grid">
      <!-- Loading or Results will appear here -->
    </div>
  </main>
  
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="giochi.html" class="nav-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      Giochi
    </a>
    <a href="bans.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Bans
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { syncData, subscribeToChanges } from './db.js';
    import { performSearch, highlightMatch, debounce } from './search.js';

    let allGiochi = [];
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');

    // Restore search state
    const savedSearch = sessionStorage.getItem('search_giochi') || '';
    if (savedSearch) searchInput.value = savedSearch;

    function renderResults(query) {
      const filtered = performSearch(query, allGiochi, ['nome', 'regole', 'materiali']);
      
      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">Nessun risultato per "${query}"</div>`;
        return;
      }

      resultsContainer.innerHTML = '';
      filtered.forEach(gioco => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const mat = (gioco.materiali || '').trim();
        const tipo = (gioco.tipo || '').trim();
        const gioc = (gioco.giocatori || '').trim();
        const ob = (gioco.obiettivo || '').trim();
        const reg = (gioco.regole || '').trim();

        let metaHtml = '';
        if (mat) metaHtml += `<span><strong>Materiali:</strong> ${highlightMatch(mat, query)}</span>`;
        if (tipo) metaHtml += `<span><strong>Tipo:</strong> ${highlightMatch(tipo, query)}</span>`;
        if (gioc) metaHtml += `<span><strong>Giocatori:</strong> ${highlightMatch(gioc, query)}</span>`;

        let bodyHtml = '';
        if (metaHtml) bodyHtml += `<div class="card-meta">${metaHtml}</div>`;
        if (ob) bodyHtml += `<p><strong>Obiettivo:</strong> ${highlightMatch(ob, query)}</p>`;
        if (reg) bodyHtml += `<p><strong>Regole:</strong><br>${highlightMatch(reg, query)}</p>`;

        card.innerHTML = `
          <div class="card-header">
            <h3 class="card-title">${highlightMatch(gioco.nome, query)}</h3>
            <span class="card-toggle">▼</span>
          </div>
          ${bodyHtml ? `<div class="card-content">${bodyHtml}</div>` : ''}
        `;
        
        // Espandi/comprimi
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
        });
        resultsContainer.appendChild(card);
      });
    }

    const handleSearch = debounce((e) => {
      const q = e.target.value;
      sessionStorage.setItem('search_giochi', q);
      renderResults(q);
    }, 200);

    searchInput.addEventListener('input', handleSearch);

    async function init() {
      resultsContainer.innerHTML = '<div class="empty-state">Caricamento...</div>';
      allGiochi = await syncData('giochi');
      renderResults(searchInput.value);

      subscribeToChanges('giochi', (newData) => {
        allGiochi = newData;
        renderResults(searchInput.value);
      });
    }

    init();
  </script>
</body>
</html>
