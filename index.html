<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giochi & Bans</title>
  
  <!-- PWA Meta Tags -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2F8FC7">
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
  
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(10px, 3vh, 40px);
      min-height: 0;
    }
    
    .hero h1 {
      text-transform: uppercase;
      letter-spacing: -1px;
    }
    
    .hero h1 {
      font-size: clamp(2.5rem, 8vh, 5.5rem);
      color: var(--color-azzurro);
      text-transform: uppercase;
      letter-spacing: -2px;
      text-shadow: 0px 8px 16px rgba(47, 143, 199, 0.2);
    }
    
    .main-logo {
      width: clamp(100px, 20vh, 170px);
      height: clamp(100px, 20vh, 170px);
      object-fit: contain;
      margin-bottom: clamp(5px, 2vh, var(--space-md));
      background: #ffffff;
      padding: clamp(8px, 2vh, 15px);
      border-radius: clamp(20px, 4vh, 30px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    
    .animated-logo {
      animation: bounce-logo 3.5s ease-in-out infinite;
    }
    
    .main-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      width: 100%;
      max-width: 300px;
    }
    
    .main-actions .btn {
      width: 100%;
      height: clamp(50px, 8vh, 60px);
      font-size: clamp(1.1rem, 3vh, var(--font-size-h3));
    }
    
    .admin-link {
      margin-top: auto;
      text-align: center;
      padding: var(--space-md);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    @media (min-width: 1025px) {
      #installAppBtn {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="hero">
    <div>
      <img src="favicon.png" alt="Agesci Ponte San Giovanni 1" class="main-logo animated-logo">
      <h1>Giochi<br>& Bans</h1>
    </div>
    
    <div class="main-actions">
      <a href="giochi.html" class="btn btn-primary">GIOCHI</a>
      <a href="bans.html" class="btn btn-secondary">BANS</a>
    </div>
  </main>
  
  <footer class="admin-link" style="display:flex; flex-direction:row; justify-content:center; align-items:center; gap:15px; flex-wrap:wrap;">
    <a href="admin.html">Accesso Admin</a>
    <button id="installAppBtn" class="btn" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; color: var(--color-text-muted);">📲 Installa App</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
