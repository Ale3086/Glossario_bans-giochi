<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bans - Giochi & Bans</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <meta name="theme-color" content="#2F8FC7">
  
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <main>
    <h1>Bans</h1>
    
    <div class="search-container">
      <div style="display:flex; gap:8px;">
        <input type="text" id="searchInput" class="search-input" placeholder="Cerca bans..." autocomplete="off" style="flex:1;">
        <select id="sortSelect" class="form-control" style="width: auto; padding: 0 10px; font-size: var(--font-size-sm); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-card-bg); color: var(--color-text);">
          <option value="az">Nome (A-Z)</option>
          <option value="za">Nome (Z-A)</option>
          <option value="corti">Testo più corto</option>
          <option value="lunghi">Testo più lungo</option>
        </select>
        <button id="startMultiPrint" class="btn btn-secondary" style="padding:0 15px;" title="Stampa Multipla">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
        </button>
      </div>
    </div>
    
    <div id="results" class="card-grid">
      <!-- Loading or Results will appear here -->
    </div>
  </main>
  
  <div id="multiPrintAction" style="display:none; position:fixed; bottom: 80px; left:50%; transform:translateX(-50%); z-index:200; background:var(--color-card-bg); padding:10px 20px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.3); align-items:center; gap:10px; border:1px solid var(--color-border); white-space:nowrap;">
    <span id="printCount" style="font-weight:bold; font-size:var(--font-size-sm);">0 selezionati</span>
    <button class="btn btn-primary" id="doMultiPrint" style="padding:6px 16px; font-size:var(--font-size-sm);">Stampa</button>
    <button class="btn btn-outline" id="cancelMultiPrint" style="padding:6px 16px; font-size:var(--font-size-sm);">Annulla</button>
  </div>
  
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="giochi.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      Giochi
    </a>
    <a href="bans.html" class="nav-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Bans
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { syncData, subscribeToChanges } from './db.js';
    import { performSearch, highlightMatch, debounce } from './search.js';

    let allBans = [];
    let selectedIds = new Set();
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const resultsContainer = document.getElementById('results');

    // Restore search state
    const savedSearch = sessionStorage.getItem('search_bans') || '';
    if (savedSearch) searchInput.value = savedSearch;
    
    const savedSort = sessionStorage.getItem('sort_bans') || 'az';
    sortSelect.value = savedSort;

    function renderResults(query) {
      let filtered = performSearch(query, allBans, ['nome', 'testo', 'note_gesti']);
      
      const sortVal = sortSelect.value;
      filtered.sort((a, b) => {
         const nomeA = (a.nome || '').toLowerCase();
         const nomeB = (b.nome || '').toLowerCase();
         
         if (sortVal === 'az') return nomeA.localeCompare(nomeB);
         if (sortVal === 'za') return nomeB.localeCompare(nomeA);
         if (sortVal === 'corti') {
           return (a.testo || '').length - (b.testo || '').length || nomeA.localeCompare(nomeB);
         }
         if (sortVal === 'lunghi') {
           return (b.testo || '').length - (a.testo || '').length || nomeA.localeCompare(nomeB);
         }
         return 0;
      });
      
      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">Nessun risultato per "${query}"</div>`;
        return;
      }

      resultsContainer.innerHTML = '';
      filtered.forEach(ban => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const isSelected = selectedIds.has(ban.id);
        if (isSelected) card.classList.add('selected');
        
        const testo = (ban.testo || '').trim();
        const note = (ban.note_gesti || '').trim();

        const hasContent = testo !== '' || note !== '';

        let bodyHtml = '';
        if (hasContent) {
          if (testo) bodyHtml += `<p><strong>Testo:</strong><br>${highlightMatch(testo, query)}</p>`;
          if (note) bodyHtml += `<p><strong>Note:</strong><br>${highlightMatch(note, query)}</p>`;
          
          let actionsHtml = '';

          actionsHtml += `
            <button class="btn btn-outline print-btn" onclick="event.stopPropagation(); window.print()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
              Stampa
            </button>
          `;
          bodyHtml += `<div class="card-actions">${actionsHtml}</div>`;
        }

        card.innerHTML = `
          <div class="card-header">
            <div style="display:flex; align-items:center; gap:10px;">
              <input type="checkbox" class="card-checkbox" style="display:none; transform:scale(1.3); pointer-events:none; margin:0;" ${isSelected ? 'checked' : ''}>
              <h3 class="card-title">${highlightMatch(ban.nome, query)}</h3>
            </div>
            ${hasContent ? '<span class="card-toggle">▼</span>' : ''}
          </div>
          ${hasContent ? `<div class="card-content">${bodyHtml}</div>` : ''}
        `;
        
        card.addEventListener('click', (e) => {
          if (document.body.classList.contains('selection-mode')) {
             if (selectedIds.has(ban.id)) {
                 selectedIds.delete(ban.id);
                 card.classList.remove('selected');
                 const cb = card.querySelector('.card-checkbox');
                 if (cb) cb.checked = false;
             } else {
                 selectedIds.add(ban.id);
                 card.classList.add('selected');
                 const cb = card.querySelector('.card-checkbox');
                 if (cb) cb.checked = true;
             }
             updatePrintCount();
             return;
          }
          if (hasContent) {
            if (e.target.tagName.toLowerCase() === 'a' || e.target.closest('button')) return;
            card.classList.toggle('expanded');
          }
        });
        
        if (!hasContent) {
          card.style.cursor = 'default';
        }
        resultsContainer.appendChild(card);
      });
    }

    const handleSearch = debounce((e) => {
      const q = e.target.value;
      sessionStorage.setItem('search_bans', q);
      renderResults(q);
    }, 200);

    searchInput.addEventListener('input', handleSearch);
    
    sortSelect.addEventListener('change', (e) => {
      sessionStorage.setItem('sort_bans', e.target.value);
      renderResults(searchInput.value);
    });

    // Multi-print Logic
    const multiPrintBtn = document.getElementById('startMultiPrint');
    const multiPrintAction = document.getElementById('multiPrintAction');
    const printCount = document.getElementById('printCount');
    const cancelMultiPrint = document.getElementById('cancelMultiPrint');
    const doMultiPrint = document.getElementById('doMultiPrint');

    multiPrintBtn.addEventListener('click', () => {
      document.body.classList.add('selection-mode');
      multiPrintAction.style.display = 'flex';
      updatePrintCount();
    });

    cancelMultiPrint.addEventListener('click', () => {
      document.body.classList.remove('selection-mode');
      multiPrintAction.style.display = 'none';
      selectedIds.clear();
      renderResults(searchInput.value);
    });

    doMultiPrint.addEventListener('click', () => {
      if (selectedIds.size === 0) return;
      if (searchInput.value !== '') {
          searchInput.value = '';
          sessionStorage.setItem('search_bans', '');
          renderResults('');
      }
      document.body.classList.remove('selection-mode');
      document.body.classList.add('printing-multiple');
      window.print();
      setTimeout(() => {
          document.body.classList.remove('printing-multiple');
          document.body.classList.add('selection-mode');
      }, 500);
    });

    function updatePrintCount() {
      printCount.textContent = selectedIds.size + ' selezionati';
    }

    async function init() {
      resultsContainer.innerHTML = '<div class="empty-state">Caricamento...</div>';
      allBans = await syncData('bans');
      renderResults(searchInput.value);

      subscribeToChanges('bans', (newData) => {
        allBans = newData;
        renderResults(searchInput.value);
      });
    }

    init();
  </script>
</body>
</html>
